services:
  n8n:
    image: n8nio/n8n
    container_name: gpc_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - ./.n8n_data:/home/node/.n8n
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo

  backend:
    build: ./backend
    container_name: gpc_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app